name: Build and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enforce approved dependency registry
        run: |
          npm config set registry https://packagefeedproxy.microsoft.io/npm/
          test "$(npm config get registry)" = "https://packagefeedproxy.microsoft.io/npm/"
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check
      - name: Build and verify standalone explorer
        run: |
          npx --no-install vite build --config vite.standalone.config.ts
          node scripts/verify-standalone.mjs

  smoke:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Read package version
        id: package
        run: echo "version=$(node -p 'require(`./package.json`).version')" >> "$GITHUB_OUTPUT"
      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: icon-picker:smoke
          build-args: |
            BUILD_VERSION=${{ steps.package.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container smoke tests
        run: |
          trap 'docker rm --force icon-picker-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach \
            --name icon-picker-smoke \
            --init \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18080:8080 \
            icon-picker:smoke
          node scripts/smoke-container.mjs

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Read and validate package version
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify version tag commit is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rsocko/icon-picker
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(steps.package.outputs.version, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(steps.package.outputs.version, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(steps.package.outputs.version, '-') }}
      - name: Build and publish image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.package.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record published digest
        run: |
          {
            echo "### Published container"
            echo
            echo '```text'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
