name: Deploy GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enforce approved dependency registry
        run: |
          npm config set registry https://packagefeedproxy.microsoft.io/npm/
          test "$(npm config get registry)" = "https://packagefeedproxy.microsoft.io/npm/"
      - run: npm ci
      - run: npm run demo:build
      - run: npm run demo:verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
