name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enforce approved dependency registry
        shell: pwsh
        run: |
          npm config set registry https://packagefeedproxy.microsoft.io/npm/
          if ((npm config get registry) -ne "https://packagefeedproxy.microsoft.io/npm/") {
            throw "Approved registry configuration failed."
          }
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run demo:build
      - run: npm run demo:verify
      - run: npm run package:verify
